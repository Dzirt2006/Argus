services:
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
        --model Qwen/Qwen3.5-4B
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
        --reasoning-parser qwen3
        --language-model-only
        --enable-prefix-caching
        --gpu-memory-utilization 0.80
        --max-model-len 16384
        --max-num-seqs 4
      

  vllm-awq:
      image: vllm/vllm-openai:latest
      ports:
        - "8000:8000"
      volumes:
        - huggingface-cache:/root/.cache/huggingface
      ipc: host
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [ gpu ]
      command: >
        --model cyankiwi/Qwen3.5-9B-AWQ-4bit
              --dtype float16
              --tensor-parallel-size 1
              --port 8000
              --gpu-memory-utilization 0.90
              --max-model-len 16384
              --max-num-seqs 2
              --enable-prefix-caching
              --reasoning-parser qwen3
              --enable-auto-tool-choice
              --tool-call-parser qwen3_coder

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      # HA runs with network_mode: host, so reach it via the host gateway.
      - HA_URL=http://host.docker.internal:8123
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - vllm
      - filesystem
      - system
      - weather
      - calendar
    stdin_open: true
    tty: true

  filesystem:
    build:
      context: .
      dockerfile: mcp_servers/filesystem/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data

  system:
    build:
      context: .
      dockerfile: mcp_servers/system/Dockerfile
    ports:
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./mcp_servers/search/searxng:/etc/searxng:ro

  search:
    build:
      context: .
      dockerfile: mcp_servers/search/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      - searxng

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    volumes:
      - ./ha_config:/config
    environment:
      - TZ=America/Chicago
    restart: unless-stopped

  memory:
    build:
      context: .
      dockerfile: mcp_servers/memory/Dockerfile
    ports:
      - "8007:8007"
    volumes:
      - ./data:/data

  switches:
    build:
      context: .
      dockerfile: mcp_servers/switches/Dockerfile
    ports:
      - "8008:8008"
    environment:
      # HA runs with network_mode: host, so reach it via the host gateway.
      - HA_URL=http://host.docker.internal:8123
      - HA_TOKEN=${HA_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  media:
    build:
      context: .
      dockerfile: mcp_servers/media/Dockerfile
    ports:
      - "8006:8006"
    # Host audio passthrough via PulseAudio. See docs/media_setup.md for the
    # ALSA fallback and for adjusting PUID if your host UID isn't 1000.
    environment:
      - PULSE_SERVER=${PULSE_SERVER:-unix:/run/user/1000/pulse/native}
      - PUID=${PUID:-1000}
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/run/user/1000/pulse/native:ro
      - ${HOME}/.config/pulse/cookie:/root/.config/pulse/cookie:ro
  weather:
    build:
      context: .
      dockerfile: mcp_servers/weather/Dockerfile
    ports:
      - "8004:8004"

  calendar:
    build:
      context: .
      dockerfile: mcp_servers/calendar/Dockerfile
    ports:
      - "8005:8005"
    volumes:
      - ./data:/data

volumes:
  huggingface-cache:
