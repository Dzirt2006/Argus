[project]
name = "argus"
version = "0.1.0"
description = "Fully local home assistant — vLLM + LangGraph + MCP + Wyoming voice"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.3",
    "fastmcp>=2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=24",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Hatchling needs explicit package selection (multiple top-level pkgs in repo);
# tests only need `agent`, so ship just that.
[tool.hatch.build.targets.wheel]
packages = ["agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
